<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f3efe6">
  <title>BirdFile</title>
  <meta name="application-name" content="BirdFile">
  <meta name="author" content="Kevin Guille">
  <meta name="description" content="Recherche d'un code oiseau (nom français et nom latin) et fiche d'oiseau en main. Chaque photo de détail est liée au numéro de bague et à la date dans un CSV.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://kevin-guille.github.io/birdfile/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="BirdFile">
  <meta property="og:title" content="BirdFile">
  <meta property="og:description" content="Recherche d'un code oiseau (nom français et nom latin) et fiche d'oiseau en main. Chaque photo de détail est liée au numéro de bague et à la date dans un CSV.">
  <meta property="og:url" content="https://kevin-guille.github.io/birdfile/">
  <meta property="og:image" content="https://kevin-guille.github.io/birdfile/icon-512.png">
  <meta property="og:image:alt" content="Icône BirdFile, oiseau avec une bague">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="BirdFile">
  <meta name="twitter:description" content="Recherche d'un code oiseau (nom français et nom latin) et fiche d'oiseau en main. Chaque photo de détail est liée au numéro de bague et à la date dans un CSV.">
  <meta name="twitter:image" content="https://kevin-guille.github.io/birdfile/icon-512.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BirdFile">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="sitemap" type="application/xml" title="Sitemap" href="https://kevin-guille.github.io/birdfile/sitemap.xml">
  <link rel="stylesheet" href="./app.css?v=20">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "BirdFile",
    "url": "https://kevin-guille.github.io/birdfile/",
    "image": "https://kevin-guille.github.io/birdfile/icon-512.png",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Android, iOS",
    "browserRequirements": "Chrome sur Android, Safari et Chrome sur iPhone",
    "inLanguage": "fr",
    "isAccessibleForFree": true,
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "EUR"
    },
    "author": {
      "@type": "Person",
      "name": "Kevin Guille",
      "url": "https://github.com/kevin-guille"
    },
    "description": "BirdFile cherche un code oiseau et affiche le nom français et le nom latin. BirdFile tient aussi la fiche d'un oiseau en main : photos des détails et cri, liés au numéro de bague. Chaque photo et chaque son est un fichier. Le ZIP d'export contient ces fichiers et index.csv. Chaque ligne relie le fichier au numéro de bague, au code, au nom français, au nom latin, à la vue et à la date de prise. Tout reste sur le téléphone.",
    "featureList": [
      "Recherche d'un code oiseau, du nom français et du nom latin",
      "Fiche d'oiseau en main, avec photos de détail liées au numéro de bague et à la date",
      "Export ZIP et index.csv, une ligne par photo ou par son"
    ]
  }
  </script>
</head>
<body>
  <header>
    <strong class="marque"><img src="./icon-512.png" alt="" width="32" height="32">BirdFile</strong>
    <p id="msg" role="status"></p>
  </header>
  <noscript>
    <p>BirdFile cherche un code oiseau et affiche le nom français et le nom latin. BirdFile tient aussi la fiche d'un oiseau en main. Les photos de détail et le cri sont liés au numéro de bague. Chaque fichier est une ligne de index.csv, avec le code, le nom français, le nom latin, la vue et la date de prise.</p>
  </noscript>
  <main>
    <section id="tab-bague">
      <label for="bague">Numéro de bague</label>
      <div class="stepper" id="stepper">
        <button type="button" id="moins">-1</button>
        <div class="bague-slot">
          <input id="bague" size="4" inputmode="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
        </div>
        <button type="button" id="plus">+1</button>
      </div>
      <div class="sauts" id="sauts">
        <button type="button" id="moins10">-10</button>
        <button type="button" id="plus10">+10</button>
        <button type="button" id="controle">Contrôle</button>
      </div>
      <p id="serie-info"></p>
      <div id="espece-saisie">
        <label for="espece-recherche">Espèce, facultative</label>
        <div class="clamp">
          <input id="espece-recherche" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" placeholder="Nom, code ou latin">
        </div>
        <div id="espece-resultats"></div>
      </div>
      <p id="espece-ligne"></p>
      <button type="button" id="retirer-espece" hidden>Retirer l'espèce</button>
      <p id="note"></p>
      <div id="vues"></div>
      <button type="button" id="libres" hidden>Ajouter photos</button>
      <p id="cri-etat"></p>
      <button type="button" id="cri" class="primaire" hidden>Ajouter audio</button>
      <audio id="cri-audio" controls hidden></audio>
      <button type="button" id="suivante">Bague suivante</button>
      <button type="button" id="effacer-une" hidden>Effacer cette bague</button>
    </section>
    <section id="tab-code" hidden>
      <label for="recherche">Recherche, sans lien avec la fiche</label>
      <div class="clamp">
        <input id="recherche" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      </div>
      <div id="resultats"></div>
    </section>
    <section id="tab-export" hidden>
      <p id="bilan"></p>
      <button type="button" id="zip" class="primaire">Télécharger le ZIP</button>
      <p id="zip-lieu" hidden></p>
      <div id="liste"></div>
      <button type="button" id="effacer">Tout effacer</button>
    </section>
  </main>
  <nav>
    <button type="button" data-tab="bague" aria-selected="true">Fiche</button>
    <button type="button" data-tab="code">Code</button>
    <button type="button" data-tab="export">Export</button>
  </nav>
  <input id="photo-fichier" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
  <section id="cam" hidden>
    <div class="cam-top">
      <button type="button" id="cam-fermer">Fermer</button>
      <p id="cam-titre"></p>
      <p id="cam-zoom">1x</p>
    </div>
    <div class="stage">
      <video id="video" playsinline autoplay muted></video>
      <p id="cam-fichier" hidden>Format 4:3, téléphone à l'horizontale. Le déclencheur ouvre l'appareil photo. Le zoom n'est pas lu.</p>
      <div class="cadre"></div>
    </div>
    <p id="cam-hint"></p>
    <p id="cam-bloque" hidden>Tourne le téléphone à l'horizontale.</p>
    <button type="button" id="declencheur" aria-label="Photographier"></button>
    <div id="apercu" hidden>
      <img id="apercu-img" alt="Photo à confirmer">
      <p id="apercu-info"></p>
      <div class="row">
        <button type="button" id="refaire">Refaire</button>
        <button type="button" id="garder" class="primaire">Garder</button>
      </div>
    </div>
  </section>
  <div id="danger" hidden role="alertdialog" aria-modal="true" aria-labelledby="danger-titre">
    <div id="danger-slot">
      <button type="button" id="danger-oui">Effacer</button>
    </div>
    <div id="danger-texte">
      <p id="danger-titre"></p>
      <p id="danger-detail"></p>
    </div>
    <button type="button" id="danger-non">Annuler</button>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
